<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초성 폭탄 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* 색은 여기서만 바꿉니다 */
:root{
  --bg:#FFF5EA; --dot:#FFE2CF; --card:#FFFFFF; --ink:#4A3B5C; --sub:#8C7FA3; --line:#F1E1D3;
  --pink:#FF8FB1; --pink-d:#E8628E; --pink-s:#FFE3EC; --mint:#7ED6C1; --mint-s:#DDF6EF;
  --butter:#FFD96B; --butter-s:#FFF3CC; --lav:#B9A5FF; --lav-s:#ECE6FF; --sky:#8FD3FF; --sky-s:#E1F3FF;
  --peach:#FFB38A; --peach-s:#FFE8D9; --red:#FF5A5F; --ok:#1F8F67; --ok-s:#DDF5EA; --no:#D9445F; --no-s:#FFE1E6;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.8px,transparent 2px);background-size:24px 24px;
  color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:17px;line-height:1.55;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.jua,.btn,.tile,.chip b{font-family:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400}
h1{font-size:2.2rem;margin:0;line-height:1.2} h2{font-size:1.6rem;margin:0 0 8px;line-height:1.3} h3{font-size:1.15rem;margin:14px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.small{font-size:.9rem} .sub{color:var(--sub)} .err{color:var(--no);font-weight:700;min-height:1.2em;margin:0}
.stack{display:grid;gap:12px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center} .row.end{justify-content:flex-end;margin-top:14px}
:focus-visible{outline:3px solid var(--pink-d);outline-offset:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border:3px solid var(--ink);
  border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);font-size:1.15rem;line-height:1.2;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15)} .btn.mint{background:var(--mint)} .btn.butter{background:var(--butter)}
.btn.lav{background:var(--lav)} .btn.sky{background:var(--sky)} .btn.red{background:var(--red);color:#fff}
.btn.big{font-size:1.45rem;min-height:62px;padding:12px 26px} .btn.wide{width:100%}
.btn.sm{min-height:40px;font-size:1rem;padding:6px 12px;border-width:2px;box-shadow:0 3px 0 var(--ink);border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px;box-shadow:0 6px 0 rgba(74,59,92,.16)}
.field{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:3px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
.field:focus{outline:none;border-color:var(--pink)}
textarea.field{resize:vertical;font-size:.95rem;line-height:1.5}
.notice{background:var(--butter-s);border-radius:14px;padding:10px 12px;font-size:.92rem;color:#6b5a2a;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--lav-s);border-radius:999px;padding:4px 14px;white-space:nowrap}
.chip b{font-size:1.2rem;letter-spacing:1px}
.ibtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:#fff;font-size:1.2rem;flex-shrink:0}
.ibtn.off{opacity:.45}

/* 초성 타일 */
.tiles{display:flex;gap:.18em;justify-content:center;flex-wrap:wrap}
.tile{width:1.5em;height:1.5em;display:grid;place-items:center;background:#fff;border:.06em solid var(--ink);border-radius:.3em;
  box-shadow:0 .08em 0 var(--ink);animation:tileIn .55s cubic-bezier(.3,1.7,.5,1) both;line-height:1}
.tile:nth-child(4n+1){background:var(--pink-s)} .tile:nth-child(4n+2){background:var(--mint-s)} .tile:nth-child(4n+3){background:var(--butter-s)} .tile:nth-child(4n+4){background:var(--lav-s)}
.topic{text-align:center;font-family:'Jua',sans-serif;font-size:1.35rem;color:var(--sub)}

/* 시작 화면 */
.start{max-width:860px;margin:0 auto;padding:40px 18px 60px;display:grid;gap:22px}
.hero{text-align:center}
.hero .bombEmoji{font-size:5rem;display:inline-block;animation:wiggle 1.4s ease-in-out infinite}
.hero h1{font-size:clamp(2.2rem,6vw,3.4rem)}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.choose .card{display:grid;gap:12px;align-content:start}
.choose .card .big-emoji{font-size:3rem}
details summary{cursor:pointer;font-weight:700}
details ol{padding-left:22px;margin:8px 0} details li{margin:6px 0}
pre.rules{background:#2d2440;color:#f4eefe;border-radius:12px;padding:12px;font-size:.85rem;overflow:auto;white-space:pre}

/* ===== 진행자 화면 ===== */
.host{min-height:100vh;display:flex;flex-direction:column}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:3px solid var(--ink);flex-wrap:wrap;position:sticky;top:0;z-index:55}
#hOv{padding-top:84px}
.logo{font-family:'Jua',sans-serif;font-size:1.5rem;white-space:nowrap}
.hbar .sp{flex:1}
.lobby{flex:1;display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:24px;padding:24px;align-items:start}
.joinCard{text-align:center;display:grid;gap:8px;justify-items:center}
.qr{background:#fff;border-radius:16px;padding:6px;line-height:0}
.qr svg,.qr img{width:100%;height:auto}
.joinCard .qr{width:min(330px,80vw)}
.code{font-family:'Jua',sans-serif;font-size:3.2rem;letter-spacing:8px;color:var(--pink-d);line-height:1.1}
.url{font-size:.85rem;color:var(--sub);word-break:break-all}
.cloud{display:flex;flex-wrap:wrap;gap:10px;min-height:150px;align-content:flex-start;margin:10px 0}
.cloud:empty::after{content:'아직 아무도 없어요. QR을 찍고 들어와 주세요! 🐣';color:var(--sub)}
.pbub{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 14px 5px 8px;
  animation:bubIn .5s cubic-bezier(.3,1.6,.5,1) both;font-weight:700}
.pbub .em{font-size:1.5rem;line-height:1}
.pbub.bot{background:var(--sky-s)}
.game{flex:1;display:grid;grid-template-columns:minmax(320px,400px) 1fr 250px;gap:18px;padding:18px;min-height:0}
.stageCol{display:flex;flex-direction:column;gap:14px}
.prompt{text-align:center}
.prompt .tiles{font-size:clamp(44px,5.6vw,92px);margin:4px 0 10px}
.prompt .rnd{font-size:.95rem;color:var(--sub)}
.bombBox{text-align:center;position:relative;padding:4px 0}
.bombSvg{width:min(230px,62%);height:auto;overflow:visible;filter:drop-shadow(0 8px 0 rgba(74,59,92,.15))}
.bomb.wiggle{animation:wiggle 1.1s ease-in-out infinite;transform-origin:50% 70%}
.bomb.jump{animation:bombJump .6s ease}
.spark{transform-origin:162px 34px;animation:spark .35s ease-in-out infinite alternate}
.paused .spark,.idle .spark{animation:none;opacity:.25}
.holder{font-family:'Jua',sans-serif;font-size:1.45rem;margin-top:4px}
.holder .em{font-size:2rem;vertical-align:middle}
.timerBig{font-family:'Jua',sans-serif;font-size:2.6rem;line-height:1.1}
.timerBig.hurry{color:var(--red);animation:pulse .5s ease-in-out infinite alternate}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.statusMsg{text-align:center;font-family:'Jua',sans-serif;font-size:1.2rem;color:var(--pink-d)}
.wallCol{display:flex;flex-direction:column;min-height:0;min-width:0}
.wallHead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.wallHead h2{margin:0}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;align-content:start;overflow:auto;padding:6px 6px 14px;max-height:calc(100vh - 150px)}
.wall:empty::after{content:'초성에 맞는 단어가 여기에 톡톡 나타나요 ✨';color:var(--sub);grid-column:1/-1;text-align:center;padding:40px 0;font-size:1.2rem}
.wcard{position:relative;background:var(--c,#fff);border:3px solid var(--ink);border-radius:20px;padding:10px 12px 8px;box-shadow:0 4px 0 var(--ink);
  animation:pop .6s cubic-bezier(.3,1.7,.5,1) both;rotate:var(--r,0deg)}
.wcard.fresh{outline:4px solid var(--butter);outline-offset:2px}
.ww{font-family:'Jua',sans-serif;font-size:2rem;line-height:1.15}
.wn{font-size:.95rem;font-weight:700}
.wt{font-size:.8rem;color:var(--sub)}
.wpass{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:0 8px;font-size:.75rem;margin-left:4px}
.wdel{position:absolute;top:2px;right:4px;border:none;background:transparent;font-size:1.3rem;opacity:.25;width:32px;height:32px;border-radius:10px}
.wcard:hover .wdel,.wdel:focus-visible{opacity:1;background:#fff}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side .card{padding:12px}
.miniJoin{text-align:center}
.miniJoin .qr{width:150px;margin:0 auto}
.miniJoin .code{font-size:1.8rem;letter-spacing:4px}
.score{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.score li{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:4px 8px}
.score li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score li b{font-family:'Jua',sans-serif}
.score:empty::after{content:'아직 점수가 없어요';color:var(--sub);font-size:.9rem}

/* 오버레이·모달 */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(74,59,92,.55);padding:16px;overflow:auto}
.ov.modal{z-index:60}
.ovBox{background:#fff;border:4px solid var(--ink);border-radius:28px;padding:22px;max-width:1000px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.2);
  animation:boxIn .45s cubic-bezier(.3,1.5,.5,1) both;max-height:calc(100vh - 32px);overflow:auto}
.boomOv{background:radial-gradient(circle,#FFF6A8 0%,#FFB347 32%,#FF5A5F 62%,rgba(74,59,92,.9) 100%);animation:flash .6s ease-out;overflow:hidden}
.boomCenter{text-align:center;position:relative;z-index:2}
.boomTxt{font-family:'Jua',sans-serif;font-size:clamp(90px,16vw,220px);line-height:1;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;
  animation:boomTxt .75s cubic-bezier(.3,1.8,.5,1) both}
.caught{font-family:'Jua',sans-serif;font-size:clamp(28px,4vw,56px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;animation:boxIn .6s .35s both}
.caught .em{-webkit-text-stroke:0}
.particle{position:fixed;left:50%;top:50%;font-size:2.6rem;pointer-events:none;z-index:70;animation:fly 1.5s ease-out forwards}
body.shake .host{animation:shake .55s}
.banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:80}
.banner span{font-family:'Jua',sans-serif;font-size:clamp(70px,12vw,170px);color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;animation:bannerIn 1.3s ease both}
.drawTitle{text-align:center;font-size:clamp(1.6rem,3vw,2.4rem)}
.drawSub{text-align:center;color:var(--sub);margin-bottom:10px}
.drawWrap{display:grid;grid-template-columns:minmax(260px,430px) 1fr;gap:24px;align-items:center}
.drawStage{position:relative}
.wheelSvg{width:100%;height:auto;display:block}
.wheelSvg text{font-family:'Jua','Gowun Dodum',sans-serif;fill:var(--ink)}
.drawSide{display:grid;gap:14px}
.resultCard{border:3px dashed var(--line);border-radius:22px;padding:18px;text-align:center;min-height:180px;display:grid;align-content:center;gap:8px}
.resultCard.placeholder{font-family:'Jua',sans-serif;font-size:1.6rem;color:var(--sub)}
.resultCard.done{border:4px solid var(--ink);background:var(--butter-s);animation:boxIn .5s cubic-bezier(.3,1.6,.5,1) both}
.resultCard.done.prize{background:var(--mint-s)}
.rcTag{justify-self:center;border-radius:999px;padding:2px 14px;font-family:'Jua',sans-serif;background:var(--pink);color:#fff}
.rcTag.prize{background:var(--ok)}
.rcIcon{font-size:3.6rem;line-height:1.1}
.rcText{font-family:'Jua',sans-serif;font-size:clamp(1.5rem,2.6vw,2.2rem);line-height:1.25}
.rcDetail{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-family:'Jua',sans-serif;font-size:clamp(1.2rem,2.2vw,1.8rem)}
.rcDetail .tiles{font-size:2.4rem;margin-top:4px}
.drawBtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.spinning{font-family:'Jua',sans-serif;font-size:1.6rem;text-align:center;animation:pulse .4s ease-in-out infinite alternate}
.roundSum{background:var(--bg);border-radius:16px;padding:10px 14px;display:grid;gap:4px}
.gacha{position:relative;width:min(320px,100%);margin:0 auto}
.gachaSvg{width:100%;height:auto;display:block}
.gacha.shake .caps{animation:capsShake .14s linear infinite}
.gacha.shake .knob{animation:knob .6s linear infinite;transform-box:fill-box;transform-origin:center}
.capsule{position:absolute;left:68%;top:80%;width:46px;height:46px;opacity:0;translate:-50% -50%}
.capsule i{position:absolute;left:0;width:100%;height:50%;border:3px solid var(--ink);transition:transform .6s,opacity .6s}
.capsule .ct{top:0;background:var(--pink);border-radius:46px 46px 0 0;border-bottom-width:1.5px}
.capsule .cb{bottom:0;background:#fff;border-radius:0 0 46px 46px;border-top-width:1.5px}
.gacha.drop .capsule{animation:capDrop .9s cubic-bezier(.3,1.4,.5,1) forwards}
.gacha.open .capsule .ct{transform:translate(-30px,-50px) rotate(-40deg);opacity:0}
.gacha.open .capsule .cb{transform:translate(30px,50px) rotate(30deg);opacity:0}
.setBox h3{margin-top:16px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.preset{border:3px solid var(--line);background:#fff;border-radius:16px;padding:6px;display:grid;gap:0;text-align:center}
.preset .ptopic{font-size:.8rem;color:var(--sub)} .preset .pcho{font-family:'Jua',sans-serif;font-size:1.5rem;letter-spacing:2px}
.preset.on{border-color:var(--pink-d);background:var(--pink-s);box-shadow:0 3px 0 var(--pink-d)}
.customRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.customRow.on .field:first-child{border-color:var(--pink-d)}
.preview{text-align:center;background:var(--bg);border-radius:18px;padding:10px;margin-top:10px}
.preview .tiles{font-size:2.6rem;margin:4px 0 10px}
.setGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 18px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:3px solid var(--line);background:#fff;border-radius:14px;padding:6px 12px;font-family:'Jua',sans-serif;font-size:1.05rem;display:grid;line-height:1.2}
.seg small{font-family:'Gowun Dodum',sans-serif;font-size:.75rem;color:var(--sub)}
.seg.on{border-color:var(--pink-d);background:var(--pink-s);box-shadow:0 3px 0 var(--pink-d)}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.95rem}
.chk input{width:22px;height:22px;accent-color:var(--pink-d)}
.listsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.listsGrid label{display:grid;gap:4px;font-family:'Jua',sans-serif}

/* ===== 참가자 화면 ===== */
.player{max-width:540px;margin:0 auto;padding:12px 14px 48px;display:flex;flex-direction:column;gap:12px}
.pHero{text-align:center;padding-top:14px}
.pHero .bombEmoji{font-size:3.6rem;display:inline-block;animation:wiggle 1.4s ease-in-out infinite}
.lbl{display:grid;gap:6px;font-family:'Jua',sans-serif;font-size:1.05rem}
.codeField{text-transform:uppercase;letter-spacing:6px;font-family:'Jua',sans-serif;font-size:1.6rem;text-align:center}
.emojiGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.emo{font-size:1.7rem;border:3px solid var(--line);border-radius:14px;background:#fff;aspect-ratio:1;padding:0;line-height:1}
.emo.on{border-color:var(--pink-d);background:var(--pink-s);transform:scale(1.06)}
.ptop{display:flex;align-items:center;gap:8px;padding:10px 12px}
.ptop .pAv{font-size:1.9rem;line-height:1}
.ptop .pNick{font-family:'Jua',sans-serif;font-size:1.15rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pStatus{text-align:center;font-family:'Jua',sans-serif;font-size:1.15rem;color:var(--pink-d);min-height:1.5em}
.pPrompt{text-align:center;padding:14px}
.pPrompt .tiles{font-size:clamp(38px,13vw,64px);margin:4px 0 10px}
.pTimer{font-family:'Jua',sans-serif;font-size:1.6rem}
.pBomb{border-radius:20px;padding:10px 14px;text-align:center;font-family:'Jua',sans-serif;font-size:1.15rem;background:#fff;border:3px solid var(--line)}
.pBomb:empty{display:none}
.pBomb.me{background:var(--red);color:#fff;border-color:var(--ink);font-size:1.35rem;animation:hot .45s ease-in-out infinite alternate}
body.hot{background-color:#FFE4E4}
.pForm{display:flex;gap:8px}
.pForm .field{font-size:1.35rem;flex:1;min-width:0}
.pForm .btn{flex-shrink:0}
.fb{min-height:2.3em;text-align:center;font-family:'Jua',sans-serif;font-size:1.15rem;line-height:1.3;display:grid;place-items:center}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)} .fb.wait{color:var(--sub)}
.fb.show{animation:boxIn .35s cubic-bezier(.3,1.6,.5,1)}
.pWords{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pWords li{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 10px}
.pWords li.mine{background:var(--mint-s)}
.pWords .w{font-family:'Jua',sans-serif;font-size:1.25rem}
.pWords .n{flex:1;min-width:0;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pWords .t{font-size:.75rem;color:var(--sub)}
.pWords:empty::after{content:'아직 나온 단어가 없어요';color:var(--sub);font-size:.9rem}
.pOvBox{max-width:460px;text-align:center;display:grid;gap:12px}
.pOvBox .big{font-size:3.6rem;line-height:1}
.waitBounce span{display:inline-block;font-size:2.2rem;animation:bounce 1s ease-in-out infinite}
.waitBounce span:nth-child(2){animation-delay:.15s} .waitBounce span:nth-child(3){animation-delay:.3s}

@keyframes tileIn{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bubIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes bombJump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-40px) scale(1.08,.92) rotate(15deg)}60%{transform:translateY(0) scale(.92,1.08) rotate(-8deg)}100%{transform:none}}
@keyframes spark{from{transform:scale(.7) rotate(0)}to{transform:scale(1.25) rotate(25deg)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes boxIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes flash{0%{background:#fff}100%{}}
@keyframes boomTxt{0%{transform:scale(0) rotate(-15deg)}100%{transform:scale(1) rotate(-4deg)}}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.2);opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-12px,6px)}40%{transform:translate(10px,-8px)}60%{transform:translate(-8px,-4px)}80%{transform:translate(6px,6px)}}

// LOGIC START — 이 구간은 화면(document, window)을 건드리지 않습니다.
const Logic = (() => {
  const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  const isSyl = ch => { const c = ch.charCodeAt(0); return ch.length === 1 && c >= 0xAC00 && c <= 0xD7A3; };
  const clean = s => String(s == null ? "" : s).normalize("NFC").replace(/\s+/g, "").slice(0, 30);
  function toChosung(s) {
    let o = "";
    for (const ch of clean(s)) {
      if (isSyl(ch)) o += CHO[Math.floor((ch.charCodeAt(0) - 0xAC00) / 588)];
      else if (CHO.includes(ch)) o += ch;
      else return null;
    }
    return o;
  }
  function parseTarget(input) {
    const s = clean(input);
    if (!s || s.length > 8) return null;
    if ([...s].every(ch => CHO.includes(ch))) return s;
    if ([...s].every(isSyl)) return toChosung(s);
    return null;
  }
  const normBad = s => String(s || "").toLowerCase().replace(/[^가-힣ㄱ-ㅎa-z]/g, "");
  function isBad(s, list) { const n = normBad(s); return !!n && (list || []).some(b => { const k = normBad(b); return k && n.includes(k); }); }
  // dict: 표준국어대사전 단어 모음(Set). null이면 사전 검사를 하지 않음
  function checkWord(raw, target, used, bad, dict) {
    const w = clean(raw);
    if (!w) return { ok: false, reason: "empty", w };
    if (![...w].every(isSyl)) return { ok: false, reason: "notHangul", w };
    if (isBad(w, bad)) return { ok: false, reason: "bad", w };
    if (w.length !== target.length) return { ok: false, reason: "length", w };
    const cho = toChosung(w);
    if (cho !== target) return { ok: false, reason: "mismatch", w, cho };
    if (dict && !dict.has(w)) return { ok: false, reason: "notInDict", w };
    if (used && (used.has ? used.has(w) : used.includes(w))) return { ok: false, reason: "dup", w };
    return { ok: true, w };
  }
  function checkNick(raw, bad) {
    const s = String(raw == null ? "" : raw).normalize("NFC").replace(/\s+/g, " ").trim();
    if (!s) return { ok: false, reason: "empty" };
    if ([...s].length > 10) return { ok: false, reason: "long" };
    if (/[@#<>&"'\\/]/.test(s)) return { ok: false, reason: "symbol" };
    if ((s.match(/\d/g) || []).length >= 3) return { ok: false, reason: "digits" };
    if (isBad(s, bad)) return { ok: false, reason: "bad" };
    return { ok: true, nick: s };
  }
  function shuffle(arr, rand = Math.random) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const pick = (arr, rand = Math.random) => arr[Math.floor(rand() * arr.length)];
  function randomNick(adj, animals, rand = Math.random) { return pick(adj, rand) + " " + pick(animals, rand); }
  // 폭탄을 넘길 다음 사람: 지금 들고 있는 사람은 빼고 무작위
  function pickNext(ids, current, rand = Math.random) {
    const c = ids.filter(i => i !== current);
    if (!c.length) return ids.includes(current) ? current : null;
    return pick(c, rand);
  }
  function bombSeconds(range, rand = Math.random) { return Math.round(range.min + rand() * (range.max - range.min)); }
  // 배경음악 빠르기: 시간이 갈수록 조금씩 빨라짐 (전체 시간과 무관 → 남은 시간을 들키지 않음)
  function bpm(elapsedSec) { return Math.min(188, 124 + Math.max(0, elapsedSec) * 0.9); }
  // 룰렛: 위쪽 바늘 아래에 idx 칸이 오도록 하는 회전 각도
  function spinTo(current, n, idx, rand = Math.random) {
    const seg = 360 / n;
    const jitter = (rand() - 0.5) * seg * 0.6;
    const want = (((360 - (idx + 0.5) * seg - jitter) % 360) + 360) % 360;
    const base = current - (((current % 360) + 360) % 360);
    return base + 360 * 5 + want;
  }
  function landed(angle, n) {
    const seg = 360 / n;
    const a = (((360 - (angle % 360)) % 360) + 360) % 360;
    return Math.floor(a / seg) % n;
  }
  function buildWheel(kind, lists, max, rand = Math.random) {
    const tag = (arr, k) => (arr || []).map(s => ({ k, s }));
    let pool;
    if (kind === "prize") pool = shuffle(tag(lists.prizes, "prize"), rand).slice(0, max);
    else if (kind === "penalty") pool = shuffle(tag(lists.penalties, "penalty"), rand).slice(0, max);
    else {
      const a = shuffle(tag(lists.prizes, "prize"), rand).slice(0, Math.floor(max / 2));
      const b = shuffle(tag(lists.penalties, "penalty"), rand).slice(0, max - a.length);
      pool = [];
      for (let i = 0; i < Math.max(a.length, b.length); i++) { if (b[i]) pool.push(b[i]); if (a[i]) pool.push(a[i]); }
    }
    if (!pool.length) pool = [{ k: kind === "prize" ? "prize" : "penalty", s: "🎲 선생님 마음대로!" }];
    while (pool.length < 2) pool.push(Object.assign({}, pool[0]));
    return pool;
  }
  function splitItem(s) {
    const str = String(s || "").trim();
    const m = str.match(/^(\S+)\s+(.+)$/);
    if (m && !/[가-힣A-Za-z0-9]/.test(m[1])) return { icon: m[1], text: m[2] };
    return { icon: "🎲", text: str };
  }
  function detailKind(text) { if (/삼행시/.test(text)) return "samhaengsi"; if (/질문/.test(text)) return "questions"; return ""; }
  // "a/b/c" 경로로 값 넣기(null이면 지우기) — 실시간 화면 동기화에 사용
  function applyUpdates(tree, updates) {
    for (const path of Object.keys(updates)) {
      const val = updates[path];
      const parts = path.split("/");
      let o = tree;
      for (let i = 0; i < parts.length - 1 && o; i++) {
        if (typeof o[parts[i]] !== "object" || o[parts[i]] === null) { if (val === null) { o = null; break; } o[parts[i]] = {}; }
        o = o[parts[i]];
      }
      if (!o) continue;
      const k = parts[parts.length - 1];
      if (val === null || val === undefined) delete o[k]; else o[k] = JSON.parse(JSON.stringify(val));
    }
    return tree;
  }
  function fmtClock(ms) { const d = new Date(ms); const p = n => String(n).padStart(2, "0"); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
  function makeRoomCode(rand = Math.random) { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 5; i++) s += A[Math.floor(rand() * A.length)]; return s; }
  // 사전 글(한 줄에 한 단어)에서 한글 단어만 모으기
  function parseDict(text) {
    const set = new Set();
    for (const line of String(text || "").split(/\r?\n/)) { const w = line.trim(); if (w && /^[가-힣]+$/.test(w)) set.add(w); }
    return set;
  }
  function wordsFor(dict, cho) {
    const out = []; if (!dict || !cho) return out;
    for (const w of dict) if (w.length === cho.length && toChosung(w) === cho) out.push(w);
    return out;
  }
  function randomChosung(banned, rand = Math.random) {
    const F = "ㄱㄴㄷㅁㅂㅅㅇㅈㅊㅎ", S = "ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅎ";
    for (let i = 0; i < 50; i++) { const c = pick([...F], rand) + pick([...S], rand); if (!(banned || []).includes(c)) return c; }
    return "ㄱㅈ";
  }
  // Firebase 설정 글(주소만 또는 firebaseConfig 통째로)에서 필요한 값 꺼내기
  function parseFbConfig(text) {
    const s = String(text || "").trim();
    if (!s) return null;
    const get = k => { const m = s.match(new RegExp(k + "[\"']?\\s*:\\s*[\"']([^\"']+)[\"']")); return m ? m[1] : null; };
    let url = get("databaseURL");
    if (!url) { const m = s.match(/https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)/i) || s.match(/http:\/\/(localhost|127\.0\.0\.1):\d+\/?\?ns=[a-z0-9-]+/i); url = m ? m[0] : null; }
    if (!url) return null;
    url = url.replace(/\/+$/, "");
    const okUrl = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/i.test(url) || /^http:\/\/(localhost|127\.0\.0\.1):\d+\/?\?ns=[a-z0-9-]+$/i.test(url);
    if (!okUrl) return null;
    const cfg = { databaseURL: url };
    const ak = get("apiKey"), pj = get("projectId"), ap = get("appId");
    if (ak) cfg.apiKey = ak; if (pj) cfg.projectId = pj; if (ap) cfg.appId = ap;
    return cfg;
  }
  return { CHO, isSyl, clean, toChosung, parseTarget, isBad, checkWord, checkNick, shuffle, pick, randomNick, pickNext, bombSeconds, bpm,
    spinTo, landed, buildWheel, splitItem, detailKind, applyUpdates, fmtClock, makeRoomCode, randomChosung, parseFbConfig, parseDict, wordsFor };
})();
// LOGIC END

};

function toast(msg) {

/* ===================== 실시간 연결 =====================
   진행자(선생님 화면)가 모든 판정을 하고, 결과를 pub/ 아래에 올립니다.
   참가자는 inbox로 단어를 보내고 pub/ 를 구독해서 화면을 그립니다.

const FB_BASE = "https://www.gstatic.com/firebasejs/10.12.2/";

async function loadFirebase(cfg) {
  if (!fbMods) {

    fbMods = { a, d };

async function hostFirebase(cfg, room, h) {
  const { D, db } = await loadFirebase(cfg);
  const path = "chosung/" + room;
  const root = D.ref(db, path), r = p => D.ref(db, path + "/" + p);
  const mirror = {};
  await withTimeout(D.set(root, { createdAt: Date.now(), pub: { meta: { status: "lobby" } } }), 10000, "timeout");
  D.onDisconnect(root).remove();
  let lost = false;
  D.onValue(D.ref(db, ".info/connected"), s => {
    if (s.val() === false) { lost = true; return; }
    if (lost) { lost = false; D.onDisconnect(root).remove(); D.update(root, { createdAt: Date.now(), pub: mirror }).catch(() => {}); }
  });

  D.onChildChanged(r("presence"), s => h.onJoin(s.key, s.val()));
  D.onChildRemoved(r("presence"), s => h.onLeave(s.key));
  D.onChildAdded(r("inbox"), s => { const v = s.val(); D.remove(s.ref).catch(() => {}); if (v && typeof v.pid === "string") h.onReq(v.pid, v); });
  return {
    put(u) { Logic.applyUpdates(mirror, u); const o = {}; for (const k in u) o["pub/" + k] = u[k] === undefined ? null : u[k]; D.update(root, o).catch(e => console.warn(e)); },
    async destroy() { try { await D.onDisconnect(root).cancel(); await D.remove(root); } catch (e) {} }

async function playerFirebase(cfg, room, pid, h) {
  const { D, db } = await loadFirebase(cfg);
  const path = "chosung/" + room;
  const pres = D.ref(db, `${path}/presence/${pid}`);
  let profile = null, stopped = false;
  D.onValue(D.ref(db, ".info/connected"), s => { if (s.val() && profile && !stopped) { D.onDisconnect(pres).remove(); D.set(pres, profile).catch(() => {}); } });
  D.onValue(pres, s => { if (!s.exists() && profile && !stopped) D.set(pres, profile).catch(() => {}); });

    async join(p) { profile = p; D.onDisconnect(pres).remove(); await withTimeout(D.set(pres, p), 10000, "timeout"); },
    send(req) { D.push(D.ref(db, path + "/inbox"), Object.assign({}, req, { pid })).catch(e => console.warn(e)); },

function hostLocal(room, h) {
  const bc = new BroadcastChannel("chosung-" + room), mirror = {}, seen = new Map();
  bc.onmessage = ev => {
    const m = ev.data || {}; if (typeof m.pid !== "string") return;
    if (m.k === "hello" || m.k === "hb") {
      const known = seen.has(m.pid); seen.set(m.pid, Date.now());
      if (!known || m.k === "hello") h.onJoin(m.pid, m.prof);
      if (m.k === "hello") bc.postMessage({ k: "full", to: m.pid, tree: mirror });
    } else if (m.k === "bye") { seen.delete(m.pid); h.onLeave(m.pid); }
    else if (m.k === "req") { seen.set(m.pid, Date.now()); h.onReq(m.pid, m.req); }
  };
  const iv = setInterval(() => { const now = Date.now(); for (const [pid, t] of seen) if (now - t > 9000) { seen.delete(pid); h.onLeave(pid); } }, 2000);
  return {
    put(u) { Logic.applyUpdates(mirror, u); try { bc.postMessage({ k: "put", u }); } catch (e) {} },
    async destroy() { clearInterval(iv); bc.close(); }
  };
}
function playerLocal(room, pid, h) {
  const bc = new BroadcastChannel("chosung-" + room);
  let tree = null, hb = null, prof = null;
  bc.onmessage = ev => {
    const m = ev.data || {};
    if (m.k === "full" && m.to === pid) { tree = m.tree || {}; h.onState(tree); }
    else if (m.k === "put" && tree) { Logic.applyUpdates(tree, m.u); h.onState(tree); }
  };
  const bye = () => { try { bc.postMessage({ k: "bye", pid }); } catch (e) {} };
  return {
    async join(p) {
      prof = p; bc.postMessage({ k: "hello", pid, prof });
      hb = setInterval(() => { try { bc.postMessage({ k: tree ? "hb" : "hello", pid, prof }); } catch (e) {} }, 2500);
      window.addEventListener("pagehide", bye);
    },
    send(req) { bc.postMessage({ k: "req", pid, req }); },
    stop() { clearInterval(hb); bye(); window.removeEventListener("pagehide", bye); bc.close(); }
  };
}

function hostOnJoin(pid, prof) {
  if (typeof pid !== "string" || pid.length > 24 || !prof || typeof prof !== "object") return;
  const nk = Logic.checkNick(prof.n, GAME_DATA.badWords);
  const n = nk.ok ? nk.nick : Logic.randomNick(GAME_DATA.nickAdj, GAME_DATA.nickAnimal);
  const e = GAME_DATA.emojis.includes(prof.e) ? prof.e : "🐰";
  let p = H.players.get(pid); const fresh = !p || !p.online;
  if (!p) { p = { n, e, score: 0, rc: 0, online: true }; H.players.set(pid, p); }
  else { p.n = n; p.e = e; p.online = true; }
  put({ ["players/" + pid]: pubP(p) });
  if (fresh) { Snd.sfx.join(); renderPlayersUI(); if (H.view === "game") toast(`${e} ${n} 입장!`); }
  if (H.meta.status === "playing" && !H.meta.holder) { H.meta.holder = pid; pushMeta(); }
}
function hostOnLeave(pid) {
  const p = H.players.get(pid); if (!p || !p.online) return;
  p.online = false; put({ ["players/" + pid]: null }); renderPlayersUI();
  if (H.meta.holder === pid && ["playing", "paused"].includes(H.meta.status)) {
    H.meta.holder = Logic.pickNext(onlineIds(), pid); pushMeta();
    if (H.meta.holder) toast(`${p.n} 님이 나가서 폭탄이 넘어갔어요`);
  }
}
function hostOnReq(pid, req) {
  if (!req || typeof req !== "object") return;
  const p = H.players.get(pid);
  if (!p || !p.online) { if (req.n) hostOnJoin(pid, { n: req.n, e: req.e }); else return; }
  if (req.t === "word") hostWord(pid, String(req.w || "").slice(0, 30), typeof req.id === "string" ? req.id.slice(0, 12) : null);
  else if (req.t === "spin") { if (H.draw && H.draw.target === pid && H.draw.state === "ready") drawSpin(); }
}
function hostWord(pid, raw, id) {
  const p = H.players.get(pid); if (!p) return;
  const fb = o => { if (id) put({ ["fb/" + pid]: Object.assign({ id }, o) }); };
  const now = Date.now();
  if (H.meta.status !== "playing") return fb({ ok: false, reason: H.meta.status === "paused" ? "paused" : "notPlaying" });
  if (H.round && H.round.turnOnly && H.meta.holder !== pid) return fb({ ok: false, reason: "notYourTurn" });
  if (now - (p.lastAt || 0) < 500) return fb({ ok: false, reason: "tooFast" });
  p.lastAt = now;
  const r = Logic.checkWord(raw, H.meta.chosung, H.used, GAME_DATA.badWords, H.round && H.round.dict);
  if (!r.ok) return fb({ ok: false, reason: r.reason, w: r.w || "", cho: r.cho || "" });
  H.used.add(r.w); p.score++; p.rc++;
  let passed = false;
  if (H.meta.holder === pid) {
    const next = Logic.pickNext(onlineIds(), pid);
    if (next && next !== pid) { H.meta.holder = next; passed = true; const np = H.players.get(next); if (np && np.bot) np.nextAt = now + 2500 + Math.random() * 5000; }
  }
  const key = "w" + String(++H.seq).padStart(5, "0");
  const rec = { p: pid, n: p.n, e: p.e, w: r.w, t: now, x: passed ? 1 : 0 };
  H.words.push(Object.assign({ key }, rec));
  const u = { ["words/" + key]: rec, ["players/" + pid]: pubP(p) };
  if (id) u["fb/" + pid] = { id, ok: true, w: r.w, x: passed ? 1 : 0 };
  if (passed) u.meta = pubMeta();
  put(u);
  addWordCard(key, rec); Snd.sfx.pop(); renderPlayersUI();
  if (passed) { Snd.sfx.whoosh(); renderStage(); const b = $("#bomb"); if (b) { b.classList.remove("jump", "wiggle"); void b.offsetWidth; b.classList.add("jump"); setTimeout(() => { b.classList.remove("jump"); b.classList.add("wiggle"); }, 620); } }
}
function hostDeleteWord(key) {
  const i = H.words.findIndex(w => w.key === key); if (i < 0) return;
  const w = H.words[i]; H.words.splice(i, 1); H.used.delete(w.w);
  const p = H.players.get(w.p);
  if (p) { p.score = Math.max(0, p.score - 1); p.rc = Math.max(0, p.rc - 1); }
  const u = { ["words/" + key]: null };
  if (p && p.online) u["players/" + w.p] = pubP(p);
  let back = false;
  if (w.x && ["playing", "paused"].includes(H.meta.status) && p && p.online && H.meta.holder !== w.p) { H.meta.holder = w.p; back = true; }
  u.meta = pubMeta(); put(u);
  const el = document.querySelector(`.wcard[data-key="${key}"]`); if (el) el.remove();
  $("#wCount").textContent = H.words.length;
  renderStage(); renderPlayersUI();
  toast(back ? `'${w.w}' 지움 — 폭탄이 ${p.n} 님에게 돌아갔어요!` : `'${w.w}' 지웠어요`);
}

/* --- 가상 친구(체험·미리 보기용) --- */
function addBots(k) {
  for (let i = 0; i < k; i++) {
    const pid = "bot" + (++H.botSeq);
    const p = { n: Logic.randomNick(GAME_DATA.nickAdj, GAME_DATA.nickAnimal), e: "🤖", score: 0, rc: 0, online: true, bot: true, nextAt: 0 };
    H.players.set(pid, p); put({ ["players/" + pid]: pubP(p) });
  }
  Snd.sfx.join(); renderPlayersUI();
  if (H.meta.status === "playing" && !H.meta.holder) { H.meta.holder = Logic.pick(onlineIds()); pushMeta(); }
}
function removeBots() { for (const [id, p] of H.players) if (p.bot && p.online) hostOnLeave(id); }
function botsAct(now) {
  if (!H.round) return;
  const ex = H.round.examples.concat(H.round.more || []).filter(w => !H.used.has(w));
  for (const [pid, p] of H.players) {
    if (!p.bot || !p.online) continue;
    const holder = H.meta.holder === pid;
    if (!p.nextAt) p.nextAt = now + 3000 + Math.random() * 6000;
    if (now < p.nextAt) continue;
    p.nextAt = now + (holder ? 2500 + Math.random() * 5000 : 7000 + Math.random() * 12000);
    if (!ex.length || (H.round.turnOnly && !holder)) continue;
    if (holder || Math.random() < 0.5) hostWord(pid, ex.splice(Math.floor(Math.random() * ex.length), 1)[0], null);
    if (H.meta.status !== "playing") return;
  }
}

/* --- 판 진행 --- */
function hostLoop() {
  const now = Date.now(), m = H.meta;
  if (m.status === "playing") {
    const left = H.timer.endAt - now;
    Snd.setBpm(Logic.bpm(H.timer.total - left / 1000));
    if (m.showTimer) {
      const sec = Math.max(0, Math.ceil(left / 1000)), el = $("#gTimer");
      if (el) { el.textContent = `⏰ ${sec}초`; el.classList.toggle("hurry", sec <= 5); }
      if (sec <= 5 && sec > 0 && sec !== H.lastSec) { H.lastSec = sec; Snd.sfx.tock(); }
    }
    if (left <= 0) { boom(); return; }
    botsAct(now);
  }
  if (H.draw && H.draw.state === "ready" && H.draw.autoAt && now >= H.draw.autoAt) { H.draw.autoAt = 0; drawSpin(); }
}
function settingTarget() {
  const s = H.set;
  if (s.useCustom) { const cho = Logic.parseTarget(s.custom); return cho ? { cho, topic: s.customTopic.trim().slice(0, 20), examples: [] } : null; }
  const r = GAME_DATA.rounds[s.presetIdx] || GAME_DATA.rounds[0];

}
function startRound() {
  const tg = settingTarget();
  if (!tg) { toast("초성 또는 한글 단어를 넣어 주세요"); return; }
  store.set("cs-host-set", H.set);

  tg.dict = H.set.dictOnly && H.dict ? H.dict : null;
  tg.turnOnly = !!H.set.turnOnly;
  if (H.dict) { const extra = Logic.shuffle(Logic.wordsFor(H.dict, tg.cho).filter(w => !tg.examples.includes(w) && !Logic.isBad(w, GAME_DATA.badWords))); tg.more = extra.slice(0, 60); }
  else tg.more = [];
  if (tg.dict) tg.examples = tg.examples.filter(w => tg.dict.has(w));
  H.round = tg; H.words = []; H.used.clear(); H.seq = 0; H.draw = null; H.lastSec = -1;
  H.players.forEach(p => { p.rc = 0; if (p.bot) p.nextAt = Date.now() + 1500 + Math.random() * 4000; });
  const range = GAME_DATA.bombTimes[H.set.time] || GAME_DATA.bombTimes.normal;
  H.timer.total = Logic.bombSeconds(range); H.timer.endAt = Date.now() + H.timer.total * 1000;
  const ids = onlineIds();
  Object.assign(H.meta, { status: "playing", round: H.meta.round + 1, chosung: tg.cho, topic: tg.topic, holder: ids.length ? Logic.pick(ids) : null, showTimer: !!H.set.showTimer });
  put({ words: null, draw: null, fb: null, meta: pubMeta() });
  closeModal(); $("#hOv").classList.add("hidden"); $("#hOv").innerHTML = "";
  showView("game"); $("#wall").innerHTML = ""; $("#wCount").textContent = "0";
  renderStage(); renderPlayersUI();
  Snd.bgmStop(); Snd.bgmStart("play"); Snd.sfx.start(); banner("💣 시작!");
}

  else if (m.status === "paused") { H.timer.endAt = Date.now() + H.timer.remain; m.status = "playing"; Snd.bgmStart("play"); }

function boom() {
  const m = H.meta; if (!["playing", "paused"].includes(m.status)) return;
  m.status = "boom"; Snd.bgmStop(); Snd.sfx.boom(); pushMeta();

function wheelSvg(items) {
  const n = items.length, seg = 360 / n, R = 140, C = 150;
  const pt = (a, r) => [C + r * Math.sin(a * Math.PI / 180), C - r * Math.cos(a * Math.PI / 180)];
  const colP = ["#FFD3E0", "#E6DCFF", "#FFC7D6", "#D9CCFF"], colG = ["#C9F0E4", "#FFEFB3", "#BFE8FF", "#FFE0C7"];
  let g = "";
  items.forEach((it, i) => {
    const a0 = i * seg, a1 = (i + 1) * seg, [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
    const fill = (it.k === "prize" ? colG : colP)[i % 4];
    g += `<path d="M${C},${C} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${fill}" stroke="#4A3B5C" stroke-width="3"/>`;
    const { icon, text } = Logic.splitItem(it.s), mid = a0 + seg / 2;
    const len = [...text].length, short = len > 8 ? [...text].slice(0, 7).join("") + "…" : text;
    const fs = len <= 5 ? 14 : len <= 7 ? 12.5 : 11; // 긴 이름은 글자를 조금 작게
    const left = mid > 180; // 왼쪽 절반은 글자가 뒤집히지 않게 반대로 배치
    g += left
      ? `<text x="${C - 34}" y="${C}" text-anchor="end" dominant-baseline="middle" font-size="${fs}" transform="rotate(${(mid - 270).toFixed(2)} ${C} ${C})">${esc(short)} <tspan font-size="20">${esc(icon)}</tspan></text>`
      : `<text x="${C + 34}" y="${C}" dominant-baseline="middle" font-size="${fs}" transform="rotate(${(mid - 90).toFixed(2)} ${C} ${C})"><tspan font-size="20">${esc(icon)}</tspan> ${esc(short)}</text>`;
  });
  return `<svg class="wheelSvg" viewBox="0 0 300 320" aria-label="룰렛">
    <g transform="translate(0,14)"><g id="wheelG">${g}</g>
    <circle cx="150" cy="150" r="22" fill="#FF8FB1" stroke="#4A3B5C" stroke-width="4"/><text x="150" y="151" text-anchor="middle" dominant-baseline="middle" font-size="18">💣</text></g>
    <path d="M150 34 L136 4 L164 4 Z" fill="#FF5A5F" stroke="#4A3B5C" stroke-width="4" stroke-linejoin="round"/></svg>`;
}
function gachaHtml() {

function renderDrawBtns() {

function roundKing() { let best = null; for (const [id, p] of H.players) if (p.online && p.rc > 0 && (!best || p.rc > best.p.rc)) best = { id, p }; return best; }

function drawSpin() {
  const d = H.draw; if (!d || d.state !== "ready") return;
  d.state = "spinning"; d.idx = Math.floor(Math.random() * d.items.length);
  put({ draw: pubDraw() }); renderDrawBtns(); Snd.sfx.click();
  const id = d.id;
  const finish = () => { if (H.draw && H.draw.id === id) drawDone(); };
  if (d.style === "wheel") {
    const n = d.items.length, from = H.rot, to = Logic.spinTo(from, n, d.idx), dur = 5200, t0 = performance.now(), g = $("#wheelG");
    let lastSeg = Math.floor(from / (360 / n));
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4), a = from + (to - from) * e;
      if (g) g.setAttribute("transform", `rotate(${a.toFixed(2)} 150 150)`);
      const sg = Math.floor(a / (360 / n)); if (sg !== lastSeg) { lastSeg = sg; Snd.sfx.tick(); }
      if (k < 1) H.raf = requestAnimationFrame(step); else { H.rot = to; finish(); }
    };
    H.raf = requestAnimationFrame(step);
    drawLater(() => { if (H.draw && H.draw.id === id && H.draw.state === "spinning") { cancelAnimationFrame(H.raf); H.rot = to; if (g) g.setAttribute("transform", `rotate(${to.toFixed(2)} 150 150)`); finish(); } }, dur + 1500);
  } else {
    const gc = $("#gacha"); if (gc) gc.classList.add("shake"); Snd.sfx.drumroll(2.2);
    drawLater(() => { if (gc) { gc.classList.remove("shake"); gc.classList.add("drop"); } Snd.sfx.click(); }, 2200);
    drawLater(() => { if (gc) gc.classList.add("open"); finish(); }, 3200);
  }
}

  } else if (m.status === "boom") {
    const mine = m.holder === P.pid;
    html = `<div class="ovBox pOvBox"><div class="big">💥</div><h2>${mine ? "펑! 내가 걸렸어요!" : m.holder ? `펑! ${esc(m.holderE)} ${esc(m.holderN)} 님이 걸렸어요!` : "펑!"}</h2></div>`;
  }
  const sig = html;
  if (sig === P.ovSig) return;
  P.ovSig = sig;
  if (!html) { ov.classList.add("hidden"); ov.innerHTML = ""; return; }
  ov.classList.remove("hidden"); ov.innerHTML = html;
  if (d && d.state === "done" && d.target === P.pid) Snd.sfx.fanfare();
}

/* ===================== 시작 ===================== */
if (params.get("r")) playerJoinScreen(params.get("r")); else startScreen();
</script>
