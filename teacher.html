<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부수 카드 수업 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#1d1b18;--stage:#fbf8f1;--ink:#23201b;--sub:#6b6458;--line:#e2dacb;--seal:#b3362c;--seal-soft:#f7e2dd;--jade:#2a6b58;--jade-soft:#dcefe6;--gold:#94650a;--gold-soft:#f9edcf;--blue:#2b5aa0;--blue-soft:#e3ebf8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);overflow:hidden}
.hj{font-family:'Noto Serif KR','Batang',serif;font-weight:900}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
/* top bar */
.bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#14120f;color:#efe9dc;overflow-x:auto;white-space:nowrap}
.bar>*{flex-shrink:0}
.bar .lesson{border:1px solid #3b362e;background:transparent;color:#cfc6b4;border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px}
.bar .lesson.on{background:var(--seal);border-color:var(--seal);color:#fff}
.bar .sp{flex:1}
.bar .tbtn{border:1px solid #3b362e;background:#24211c;color:#efe9dc;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700}
.timer{display:flex;align-items:center;gap:6px;background:#24211c;border:1px solid #3b362e;border-radius:8px;padding:3px 8px}
.timer .t{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px;color:#f4c45a;min-width:64px;text-align:center}
.timer.end .t{color:#ff7a6b}
.timer button{border:0;background:#3b362e;color:#efe9dc;border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700}
/* stage */
:root{--pw:0px}
body.exon{--pw:min(36vw, 540px)}
.wrap{height:calc(100% - 52px - 40px);display:flex;align-items:center;justify-content:center;gap:10px;padding:10px}
.stage{flex:0 0 auto;aspect-ratio:16/9;width:min(calc(100vw - 20px - var(--pw)), calc((100vh - 112px) * 16 / 9));background:var(--stage);border-radius:14px;position:relative;overflow:hidden;font-size:calc(min(100vw - 20px - var(--pw), (100vh - 112px) * 16 / 9) / 64);box-shadow:0 10px 40px rgba(0,0,0,.4)}
/* example side panel */
.exp{display:none;flex:0 0 auto;width:calc(var(--pw) - 10px);height:100%;overflow:auto;background:var(--stage);border-radius:14px;padding:12px 14px;font-size:clamp(12px,1.05vw,16px)}
body.exon .exp{display:block}
.exp .exh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.exp .exh b{font-size:1.1em}
.exp .tabs{display:flex;gap:6px;margin-bottom:8px}
.exp .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.92em}
.exp .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.exp .deck4{grid-template-columns:1fr 1fr;font-size:.95em}
.exp .tip{font-size:.85em;color:var(--sub);margin-top:8px}
/* example sheet + card mocks */
table.ex{width:100%;border-collapse:collapse;background:#fff;font-size:1em}
table.ex th{background:#fff6dc;text-align:left;white-space:nowrap;padding:.32em .6em;border:.1em solid var(--line);width:1%;vertical-align:top}
table.ex td{padding:.32em .6em;border:.1em solid var(--line);line-height:1.45}
table.ex .hj{font-size:1.15em}
table.ex.focus tr:not(.hl){opacity:.35}
table.ex tr.hl th,table.ex tr.hl td{background:#fff1b8;border-color:#e9b400}
table.ex tr.hl th{box-shadow:inset .35em 0 0 #e9b400}
table.ex tr{cursor:pointer;transition:opacity .2s}
.sub{color:var(--sub);font-size:.88em}
.hl{box-shadow:0 0 0 .16em #e9b400;background-color:#fff1b8 !important;border-radius:.3em;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .3em rgba(233,180,0,.45)}}
.deck4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em}
.cm{aspect-ratio:1;background:#fff;border:.18em solid var(--c,#b3362c);border-radius:.7em;display:flex;flex-direction:column;gap:.22em;padding-bottom:.4em;overflow:hidden;font-size:.6em}
.cmh{background:var(--c);color:#fff;display:flex;justify-content:space-between;padding:.25em .6em;font-weight:900;font-size:.9em}
.cma{margin:0 .5em;background:var(--cs);border-radius:.5em;flex:1;display:grid;place-items:center;position:relative;min-height:0}
.cma .hj{font-size:4em;color:var(--c);line-height:1}
.cma em{position:absolute;bottom:.25em;font-style:normal;font-size:.8em;background:rgba(255,255,255,.88);padding:0 .45em;border-radius:.3em;white-space:nowrap}
.cm>b,.cm>div:not(.cmh):not(.cma){margin-left:.6em;margin-right:.6em}
.cmi{font-size:.9em;line-height:1.3}
.cmf{display:flex;gap:.3em}.cmf span{background:#f4f0e8;border-radius:.3em;padding:0 .35em;font-size:.95em}
.cml{font-size:.8em;color:#4d473e;line-height:1.3}
.cms{font-size:.68em;color:var(--sub)}
.cm.cover{--c:var(--seal);background:var(--seal-soft)}
.cvt{font-size:2em;font-weight:900;line-height:1.15;margin-top:.25em}
.cvr{display:flex;gap:.4em;margin-top:auto!important}.cvr span{flex:1;aspect-ratio:1;background:#fff;border:.12em solid var(--seal);border-radius:.4em;display:grid;place-items:center;font-size:2.1em}
.big2 .cm{font-size:.74em}
/* interactive bug-finding note */
.bug{border-bottom:.12em dashed var(--seal);cursor:pointer;padding:0 .15em;border-radius:.2em;background:#fff6f4}
.bug .fix{display:none;color:var(--jade);font-weight:900}
.bug.open{background:var(--jade-soft);border-bottom-color:var(--jade)}
.bug.open .fix{display:inline}
.mark{display:inline-block;font-weight:900;border-radius:.4em;padding:0 .45em;margin-left:.3em;font-size:.95em}
.mark.r{background:var(--seal);color:#fff}.mark.g{background:var(--gold);color:#fff}
/* dictionary mock */
.dict{background:#fff;border:2px solid #cfd8cf;border-radius:.8em;overflow:hidden;font-size:1.05em}
.dict .dbar{background:#03c75a;color:#fff;font-weight:900;padding:.35em .8em}
.dict .dbar span{background:#fff;color:#222;border-radius:.4em;padding:.05em .6em;margin-left:.4em;font-family:'Noto Serif KR',serif}
.dict .row{display:flex;align-items:center;gap:.5em;padding:.35em .8em;border-bottom:1px solid #eee}
.dict .tab{padding:.1em .6em;border-radius:999px;background:#f1f1f1}
.dict .tab.on{background:#222;color:#fff;font-weight:700}
.dict .lst{display:flex;gap:.4em;flex-wrap:wrap}
.dict .lst span{border:1px solid #ddd;border-radius:.4em;padding:.05em .45em;font-size:1.05em}
.dict .lst span.pick{border-color:var(--seal);background:var(--seal-soft)}
.num{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--seal);color:#fff;font-weight:900;font-size:.85em;flex:0 0 auto}
/* canva editor mock */
.cvm{background:#fff;border:2px solid #d6d3f0;border-radius:.8em;overflow:hidden;font-size:.95em}
.cvm .top{display:flex;align-items:center;gap:.6em;background:linear-gradient(90deg,#00c4cc,#7d2ae8);color:#fff;padding:.3em .7em;font-weight:700}
.cvm .top .ttl{flex:1;font-size:.9em;opacity:.95}
.cvm .top .sh{background:#fff;color:#7d2ae8;border-radius:.4em;padding:.05em .6em}
.cvm .top .ed{background:#ffd54f;color:#333;border-radius:.4em;padding:.05em .6em}
.cvm .body{display:grid;grid-template-columns:9em 1fr;min-height:0}
.cvm .side{background:#f6f5fb;padding:.5em;border-right:1px solid #e6e3f3}
.cvm .side .q{background:#fff;border:1px solid #ddd;border-radius:.4em;padding:.15em .4em;margin:.3em 0}
.cvm .side .g{display:grid;grid-template-columns:1fr 1fr;gap:.3em;font-size:1.5em;text-align:center}
.cvm .page{padding:.5em;display:grid;place-items:center;background:#eceaf3}
.cvm .page .cm{width:17em;font-size:.48em}
.cvm .strip{display:flex;gap:.35em;padding:.35em .6em;background:#fff;border-top:1px solid #e6e3f3}
.cvm .strip span{border:2px solid #ddd;border-radius:.3em;padding:.05em .45em;font-size:.85em}
.cvm .strip span.on{border-color:#7d2ae8;color:#7d2ae8;font-weight:900}
.cvm .strip span.ex{background:var(--gold-soft)}
/* download mock */
.dlm{background:#fff;border:2px solid #d6d3f0;border-radius:.8em;padding:.7em .9em;font-size:1.1em}
.dlm .r{display:flex;justify-content:space-between;align-items:center;margin:.35em 0}
.dlm .sel{border:1px solid #ccc;border-radius:.4em;padding:.1em .6em;background:#fafafa}
.dlm .go{background:#7d2ae8;color:#fff;text-align:center;border-radius:.5em;padding:.35em;font-weight:900;margin-top:.5em}
.ann{list-style:none;padding:0;margin:0}
.ann li{display:flex;gap:.5em;align-items:flex-start;margin:.32em 0;font-size:1.15em}
.weak .cma .hj{font-size:1.3em}
.frame2{background:#fff;border:2px dashed var(--blue);border-radius:.7em;padding:.6em .9em;font-size:1.25em;line-height:1.8}
.stepper{display:flex;gap:.35em;margin:.15em 0 .3em;flex-wrap:wrap}
.stepper span{font-size:.9em;font-weight:700;padding:.1em .6em;border-radius:999px;background:#efe9dd;color:var(--sub)}
.stepper span.on{background:var(--seal);color:#fff}
.stepper span.done{background:var(--jade-soft);color:var(--jade)}
.eq{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;margin:.3em 0 .6em}
.eq div{background:#fff;border:2px solid var(--line);border-radius:.6em;padding:.35em .7em;font-size:1.2em;text-align:center}
.eq div small{display:block;font-size:.65em;color:var(--sub);font-weight:700}
.eq b.op{font-size:1.8em;color:var(--sub)}
.frame{background:#fff;border:2px dashed var(--seal);border-radius:.7em;padding:.6em .9em;font-size:1.3em;line-height:1.7}
.frame u{text-decoration:none;border-radius:.3em;padding:0 .3em;font-weight:900}
.u1{background:var(--blue-soft);color:var(--blue)}.u2{background:var(--seal-soft);color:var(--seal)}.u3{background:var(--gold-soft);color:var(--gold)}
.maprow{display:flex;align-items:center;gap:.6em;margin:.3em 0;font-size:1.25em}
.maprow .from{flex:1;background:#fff;border:2px solid var(--line);border-radius:.6em;padding:.3em .7em}
.maprow .arr{color:var(--sub);font-weight:900}
.maprow .to{background:var(--seal-soft);border:2px solid #ecc3bb;border-radius:.6em;padding:.1em .6em;font-size:1.4em}
.tree{display:flex;flex-direction:column;align-items:center;gap:.3em}
.tree .root{font-size:3.2em;color:var(--seal);line-height:1}
.tree .kids{display:flex;gap:.8em}
.tree .kids div{background:#fff;border:2px solid var(--line);border-radius:.6em;padding:.3em .8em;text-align:center;font-size:1.15em}
.tree .kids div .hj{font-size:1.8em;display:block;line-height:1.1}
.tree .kids div.no{opacity:.45;border-style:dashed}
.slide{position:absolute;inset:0;padding:3.2em 3.6em 3em;display:none;flex-direction:column}
.slide.on{display:flex}
.kicker{font-size:1.05em;font-weight:900;color:var(--seal);letter-spacing:.02em}
.slide h1{font-size:2.7em;line-height:1.25;margin:.15em 0 .5em;font-weight:900}
.slide h2{font-size:1.5em;margin:0 0 .4em}
.slide p,.slide li{font-size:1.25em;line-height:1.55}
.slide ul,.slide ol{margin:.2em 0;padding-left:1.3em}
.grid{display:grid;gap:1em}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.box{background:#fff;border:2px solid var(--line);border-radius:.8em;padding:.9em 1.1em}
.box b.t{display:block;font-size:1.25em;margin-bottom:.2em}
.red{background:var(--seal-soft);border-color:#ecc3bb}.green{background:var(--jade-soft);border-color:#b9dccb}.gold{background:var(--gold-soft);border-color:#ecd59c}.blue{background:var(--blue-soft);border-color:#c3d3ee}
.flow{display:flex;gap:.6em;margin-top:.4em}
.flow div{flex:var(--w,1);background:#fff;border:2px solid var(--line);border-radius:.7em;padding:.6em .7em;font-size:1.1em}
.flow div b{display:block;color:var(--seal);font-size:.9em}
.flow div span{font-weight:900;font-size:1.1em}
.big{font-size:4.5em;line-height:1}
.pill{display:inline-block;border-radius:999px;padding:.1em .7em;font-weight:900;font-size:.95em}
.p-red{background:var(--seal);color:#fff}.p-green{background:var(--jade);color:#fff}.p-gold{background:var(--gold);color:#fff}.p-blue{background:var(--blue);color:#fff}
.note{position:absolute;left:0;right:0;bottom:0;background:#14120f;color:#e9e1d0;font-size:.95em;padding:.7em 1.2em;display:none}
body.notes .note{display:block}
.foot{position:absolute;right:1.4em;bottom:1em;font-size:.85em;color:var(--sub)}
/* quiz */
.qz{background:#fff;border:2px solid var(--line);border-radius:.8em;text-align:center;padding:.6em .4em;cursor:pointer;user-select:none}
.qz .hj{font-size:3.6em;line-height:1.1;display:block}
.qz .opt{font-size:1.3em;font-weight:900;color:var(--sub)}
.qz .ans{display:none;font-size:1.05em;margin-top:.3em}
.qz.open{border-color:var(--jade);background:var(--jade-soft)}
.qz.open .ans{display:block}
.qz.open .opt{display:none}
.forb{display:flex;gap:.45em;flex-wrap:wrap}
.forb span{font-family:'Noto Serif KR',serif;font-weight:900;font-size:2.2em;width:1.7em;height:1.7em;display:grid;place-items:center;background:#fff;border:2px solid #ecc3bb;border-radius:.3em;color:var(--seal);position:relative}
.forb span::after{content:'✕';position:absolute;top:-.25em;right:-.2em;font-size:.35em;background:var(--seal);color:#fff;border-radius:50%;width:1.4em;height:1.4em;display:grid;place-items:center;font-family:'Noto Sans KR'}
.chips{display:flex;flex-wrap:wrap;gap:.4em}
.chips span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:.15em .7em;font-size:1em}
.chips span .hj{color:var(--seal)}
.step{display:flex;gap:.7em;align-items:flex-start;margin:.35em 0}
.step i{font-style:normal;flex:0 0 1.8em;height:1.8em;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.05em}
.step p{margin:0}
.mock{background:#fff;border:3px solid var(--seal);border-radius:.8em;padding:.7em;display:flex;flex-direction:column;gap:.35em}
.mock .art{background:var(--seal-soft);border-radius:.6em;height:7.5em;display:grid;place-items:center;position:relative}
.mock .art .hj{font-size:6em;color:var(--seal);line-height:1}
.mock .art em{position:absolute;bottom:.3em;font-style:normal;font-size:.9em;background:rgba(255,255,255,.85);padding:.05em .5em;border-radius:.4em}
.mock .fam{display:flex;gap:.4em;font-size:1.05em}
.mock .fam span{background:#f4f0e8;border-radius:.3em;padding:0 .4em}
.okx{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em}
.okx div{border-radius:.7em;padding:.7em;font-size:1.15em;background:#fff;border:2px solid var(--line)}
.okx .o{border-color:var(--jade);background:var(--jade-soft)}
.okx .x{border-color:#ecc3bb;background:var(--seal-soft)}
table.rb{width:100%;border-collapse:collapse;font-size:1.1em;background:#fff}
table.rb td,table.rb th{border:2px solid var(--line);padding:.35em .6em;text-align:left;vertical-align:top}
table.rb th{background:#f1ece2}
/* bottom nav */
.nav{height:40px;display:flex;align-items:center;justify-content:center;gap:10px;color:#cfc6b4;font-size:14px}
.nav button{border:1px solid #3b362e;background:#24211c;color:#efe9dc;border-radius:8px;padding:4px 14px;font-weight:700}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#4a443a;cursor:pointer}
.dots i.on{background:#f4c45a}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,8,6,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.ovbox{background:var(--stage);border-radius:16px;padding:24px;max-width:860px;width:100%}
.ovbox h2{margin:0 0 10px}
.ovbox input{width:100%;font:inherit;padding:9px 11px;border:1px solid #cfc6b3;border-radius:8px;margin:4px 0 10px}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.qrs .q{background:#fff;border-radius:12px;padding:12px;text-align:center}
.qrs .q div{width:100%;aspect-ratio:1;display:grid;place-items:center}
.qrs .q svg{width:100%;height:100%}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #cfc6b3}
.bigtimer{font-size:min(28vw,40vh);font-weight:900;color:#f4c45a;font-variant-numeric:tabular-nums;line-height:1}
.bigtimer.end{color:#ff7a6b}
@media (max-width:700px){.bar .lbl{display:none}}
</style>
</head>
<body>
<div class="bar">
  <span class="hj" style="font-size:20px;color:#f4c45a">部</span>
  <span class="lbl" style="font-weight:700;font-size:14px;margin-right:6px">부수 캐릭터 카드</span>
  <button class="lesson" data-lesson="0">1차시</button>
  <button class="lesson" data-lesson="1">2차시</button>
  <button class="lesson" data-lesson="2">3차시</button>
  <button class="lesson" data-lesson="3">4차시</button>
  <span class="sp"></span>
  <div class="timer" id="timer"><span class="t" id="tT">05:00</span><button id="tGo">시작</button><button id="tRe">↺</button><button id="tBig" title="크게 보기">⤢</button></div>
  <button class="tbtn" id="exBtn" title="E 키 · 수행평가 예시를 옆에 띄우기">예시 패널</button>
  <button class="tbtn" id="qrBtn">QR</button>
  <button class="tbtn" id="noteBtn" title="N 키">메모</button>
  <button class="tbtn" id="fsBtn" title="F 키">전체화면</button>
</div>
<div class="wrap"><div class="stage" id="stage"></div>
  <aside class="exp" id="exPanel" aria-label="수행평가 예시">
    <div class="exh"><b>수행평가 예시 · 「축구하는 나」</b><button class="btn ghost" id="exClose" style="padding:3px 10px">닫기</button></div>
    <div class="tabs"><button data-extab="note" class="on">탐구 노트 (2차시)</button><button data-extab="card">카드뉴스 4쪽 (3~4차시)</button></div>
    <div id="exBody"></div>
    <p class="tip">슬라이드를 넘기면 관련 칸이 노랗게 표시돼요. 칸을 누르면 직접 짚어 줄 수 있어요. (E 키로 열고 닫기)</p>
  </aside>
</div>
<div class="nav"><button id="prev">◀</button><div class="dots" id="dots"></div><span id="pos"></span><button id="next">▶</button></div>

<div class="ov hidden" id="qrOv"><div class="ovbox">
  <h2>학생 접속 QR</h2>
  <div class="qrs">
    <div><label><b>학생용 웹앱 주소</b></label><input id="uApp" placeholder="https://... (웹앱을 올린 주소)">
      <label><b>캔바 템플릿 링크</b></label><input id="uCanva" placeholder="https://www.canva.com/design/.../view?mode=preview">
      <p style="font-size:14px;color:var(--sub);margin:0 0 10px">웹앱 주소에 캔바 링크가 자동으로 붙어서, 학생 웹앱의 [캔바로 출발] 화면에 캔바 버튼이 생겨요. 입력값은 이 컴퓨터에 기억돼요.</p>
      <button class="btn" id="qrMake">QR 만들기</button> <button class="btn ghost" id="qrClose">닫기</button></div>
    <div class="grid g2" style="gap:10px">
      <div class="q"><div id="qApp"></div><b>학생 웹앱</b></div>

    <div class="box green"><b class="t">□ 연결 문장</b><span class="sub">까닭이 있게</span></div><div class="box green"><b class="t">□ AI 기능 안 씀</b><span class="sub">↺ 피드백도 고침</span></div></div></div>`},
 {t:240, h:`<div class="kicker">제출 · 4분</div><h1 style="margin-bottom:.4em">예시 쪽 지우고 PNG로 제출</h1>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:1.2em;align-items:start"><div>
   <div class="step"><i>1</i><p>쪽 목록에서 <b>2쪽 예시(人)</b> 선택 → 휴지통 🗑</p></div>
   <div class="step"><i>2</i><p>오른쪽 위 <b>[공유] → [다운로드]</b></p></div>
   <div class="step"><i>3</i><p><b>PNG</b> · 모든 페이지(4) → 다운로드</p></div>
   <div class="step"><i>4</i><p>클래스룸 과제에 올리고 <b>[제출]</b> <span class="sub">(여러 장은 압축 파일 하나로 받아져요)</span></p></div>
   <div class="box gold" style="margin-top:.4em;padding:.45em .9em"><p style="margin:0">파일 이름: 반_번호_이름_부수도감 &nbsp;예) 1_15_김한문_부수도감</p></div></div>
   ${DL_MOCK}</div>`},
 {t:540, ex:'card', h:`<div class="kicker">감상 · 성찰 · 9분</div><h1 style="margin-bottom:.3em">친구의 부수 도감 둘러보기</h1>
  <div class="grid" style="grid-template-columns:1.1fr 1fr;gap:1.2em;align-items:start">
   <div class="deck4" style="grid-template-columns:1fr 1fr;font-size:.62em;max-width:26em">${coverMock()}${cardMock(0)}${cardMock(1)}${cardMock(2)}</div>
   <div><div class="frame2"><b style="color:var(--blue)">칭찬 한 줄 틀</b><br>○○의 카드에서 새로 알게 된 부수는 <u>( &nbsp;&nbsp;&nbsp; )</u>야.<br><u>( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</u>한 점이 멋져!</div>
    <div class="box green" style="margin-top:.6em;padding:.5em .9em"><b class="t">성찰 (학습지 뒷면)</b><p style="margin:0">1. 부수를 알면 처음 보는 한자의 뜻을 짐작할 수 있을까?<br>2. 새롭게 알게 된 점 / 자랑하고 싶은 점</p></div></div></div>`,
  n:'성찰과 착각한 한자 칸은 세특 기록 근거가 됩니다. 학습지를 꼭 회수하세요.'},
 {t:60, h:`<div style="margin:auto;text-align:center"><div class="hj" style="font-size:7em;color:var(--seal);line-height:1">部首</div><h1 style="margin-top:.3em">부수는 한자의 뜻을 여는 열쇠!</h1><p>4시간 동안 수고했어요. 여러분의 부수 도감은 친구들의 한자 공부를 돕는 자료가 됩니다.</p></div>`}
]}
];

let lesson = 0, idx = 0;
try { const s = JSON.parse(localStorage.getItem('busu-teacher-pos')||'{}'); if (s.l != null){ lesson = s.l; idx = s.i||0; } } catch(e){}
const stage = $('stage');
function render(){
  const ls = L[lesson];
  if (idx >= ls.slides.length) idx = ls.slides.length - 1;
  stage.innerHTML = ls.slides.map((s,i) => `<section class="slide ${i===idx?'on':''}">${s.h}${s.n?`<div class="note">교사 메모 · ${s.n}</div>`:''}<div class="foot">${ls.title} · ${i+1}/${ls.slides.length}</div></section>`).join('');
  document.querySelectorAll('.lesson').forEach(b => b.classList.toggle('on', +b.dataset.lesson === lesson));
  $('dots').innerHTML = ls.slides.map((_,i) => `<i class="${i===idx?'on':''}" data-i="${i}"></i>`).join('');
  $('pos').textContent = `${idx+1} / ${ls.slides.length}`;
  if (!running) setTimer(ls.slides[idx].t || 300);
  try { localStorage.setItem('busu-teacher-pos', JSON.stringify({l:lesson,i:idx})); } catch(e){}
  const cur = ls.slides[idx];
  exHl = cur.hl || []; if (cur.ex) exTab = cur.ex;
  renderPanel();
}
/* example side panel */
let exTab = 'note', exHl = [];
function renderPanel(){
  if (!document.body.classList.contains('exon')) return;
  document.querySelectorAll('[data-extab]').forEach(b => b.classList.toggle('on', b.dataset.extab === exTab));
  $('exBody').innerHTML = exTab === 'note'
    ? `<p class="sub" style="margin:0 0 6px">테마 <b>축구하는 나</b> · 부수 3개 足·走·目 중 <b>足</b>을 채운 탐구 노트</p>${exSheet(exHl)}
       <div class="box gold" style="margin-top:8px;padding:8px 10px;font-size:.92em"><b>가족 한자</b> = 같은 부수를 가진 한자 (부수마다 2개)<br><b>연결 문장</b> = 한자 뜻 + 부수 뜻 → 까닭 <span class="sub">예) 蹴(차다)+足(발) → 차는 일은 발로 하니까</span></div>`
    : `<p class="sub" style="margin:0 0 6px">캔바 카드뉴스 4쪽 · 1쪽 표지 + 2~4쪽 카드 (한 쪽에 부수 1개)</p>${deckMock(exHl)}`;
  const first = $('exBody').querySelector('.hl');
  if (first) first.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function togglePanel(force){
  const on = force != null ? force : !document.body.classList.contains('exon');
  document.body.classList.toggle('exon', on);
  try { localStorage.setItem('busu-teacher-ex', on ? '1' : '0'); } catch(e){}
  renderPanel();
}
function go(d){
  const n = L[lesson].slides.length;
  idx += d;
  if (idx < 0){ if (lesson > 0){ lesson--; idx = L[lesson].slides.length - 1; } else idx = 0; }
  if (idx >= n){ if (lesson < L.length - 1){ lesson++; idx = 0; } else idx = n - 1; }
  render();
}
/* timer */
let left = 300, total = 300, running = null;
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function setTimer(s){ total = left = s; paint(); }
function paint(){ $('tT').textContent = fmt(left); $('tBigT').textContent = fmt(left); $('timer').classList.toggle('end', left === 0); $('tBigT').classList.toggle('end', left === 0); $('tGo').textContent = running ? '정지' : '시작'; }
function chime(){ try { const A = window.AudioContext || window.webkitAudioContext, a = new A(); [0, .35, .7].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.setValueAtTime(.25, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .3); o.start(a.currentTime + t); o.stop(a.currentTime + t + .3); }); } catch(e){} }
function toggle(){
  if (running){ clearInterval(running); running = null; }
  else { if (left === 0) left = total; running = setInterval(() => { left = Math.max(0, left - 1); if (left === 0){ clearInterval(running); running = null; chime(); } paint(); }, 1000); }
  paint();
}
/* QR */
function qr(el, url){
  if (!url){ el.innerHTML = '<span style="color:#999">주소 없음</span>'; return; }
  if (typeof window.qrcode !== 'function'){ el.innerHTML = '<span style="color:#999">QR 도구를 못 불러왔어요</span>'; return; }
  try { const q = window.qrcode(0, 'M'); q.addData(url); q.make(); el.innerHTML = q.createSvgTag({cellSize:4, margin:2, scalable:true}); }
  catch(e){ el.innerHTML = '<span style="color:#999">주소가 너무 길어요</span>'; }
}
function makeQr(){
  const app = $('uApp').value.trim(), cv = $('uCanva').value.trim();
  try { localStorage.setItem('busu-teacher-urls', JSON.stringify({app, cv})); } catch(e){}
  let full = app;
  if (app && cv && cv !== DEF_CANVA){ try { const u = new URL(app); u.searchParams.set('canva', cv); full = u.toString(); } catch(e){ full = app + (app.includes('?')?'&':'?') + 'canva=' + encodeURIComponent(cv); } }
  qr($('qApp'), full); qr($('qCanva'), cv);
}
const DEF_CANVA = 'https://canva.link/g11bkrld1191zvz';
$('uCanva').value = DEF_CANVA;
$('uApp').value = 'https://verbanova-space.github.io/busu2026/';
try { const u = JSON.parse(localStorage.getItem('busu-teacher-urls')||'{}'); if (u.app) $('uApp').value = u.app; if (u.cv) $('uCanva').value = u.cv; } catch(e){}

document.addEventListener('click', e => {
  const t = e.target;
  const qz = t.closest('.qz'); if (qz){ qz.classList.toggle('open'); return; }
  const bg = t.closest('.bug'); if (bg){ bg.classList.toggle('open'); return; }
  const et = t.closest('[data-extab]'); if (et){ exTab = et.dataset.extab; renderPanel(); return; }
  const pf = t.closest('#exBody [data-f]'); if (pf){ const k = pf.dataset.f; exHl = (exHl.length === 1 && exHl[0] === k) ? [] : [k]; renderPanel(); return; }
  if (t.id === 'exBtn'){ togglePanel(); return; }
  if (t.id === 'exClose'){ togglePanel(false); return; }
  const ls = t.closest('[data-lesson]'); if (ls){ lesson = +ls.dataset.lesson; idx = 0; render(); return; }
  if (t.dataset.i != null){ idx = +t.dataset.i; render(); return; }
  if (t.id === 'prev') go(-1);
  else if (t.id === 'next') go(1);
  else if (t.id === 'tGo') toggle();
  else if (t.id === 'tRe'){ clearInterval(running); running = null; setTimer(L[lesson].slides[idx].t || 300); }
  else if (t.id === 'tBig'){ $('tLabel').textContent = L[lesson].title; $('tOv').classList.remove('hidden'); }
  else if (t.id === 'tBigClose') $('tOv').classList.add('hidden');
  else if (t.id === 'qrBtn'){ $('qrOv').classList.remove('hidden'); makeQr(); }
  else if (t.id === 'qrMake') makeQr();
  else if (t.id === 'qrClose') $('qrOv').classList.add('hidden');
  else if (t.id === 'noteBtn') document.body.classList.toggle('notes');
  else if (t.id === 'fsBtn') fullscreen();
});
function fullscreen(){ try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch(e){} }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(-1); }
  else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('notes');
  else if (e.key === 'f' || e.key === 'F') fullscreen();
  else if (e.key === 't' || e.key === 'T') toggle();
  else if (e.key === 'e' || e.key === 'E') togglePanel();
  else if (e.key === 'Escape'){ $('qrOv').classList.add('hidden'); $('tOv').classList.add('hidden'); }
  else if (/^[1-4]$/.test(e.key)){ lesson = +e.key - 1; idx = 0; render(); }
});
try { if (localStorage.getItem('busu-teacher-ex') === '1') document.body.classList.add('exon'); } catch(e){}
render();
})();
</script>
</body>
</html>
